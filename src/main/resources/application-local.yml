spring:
  config:
    activate:
      on-profile: local

  thymeleaf:
    cache: false

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:expert
    driver-class-name: org.h2.Driver
    username: sa
    password:

#  datasource:
#    url: ${LOCAL_DB_URL}
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    username: ${LOCAL_DB_USERNAME}
#    password: ${LOCAL_DB_PASSWORD}
#
  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret:
    key: ${JWT_SECRET}
  token-validity-in-seconds: ${LOCAL_JWT_VALIDITY:36400}
  refresh-token-validity-in-seconds: ${LOCAL_JWT_REFRESH_VALIDITY:804600}

